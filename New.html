<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Predictor • BET261</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b0f1a 0%, #141b2b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .glass-card {
            background: rgba(18, 25, 40, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(74, 144, 226, 0.2);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 255, 255, 0.1) inset;
            width: 100%;
            max-width: 1000px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .predictor-header {
            padding: 2rem 2.5rem;
            background: rgba(8, 12, 22, 0.6);
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .logo-badge {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            width: 48px;
            height: 48px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
        }

        .title h1 {
            color: white;
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .title span {
            color: #8ba2d0;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .joueur-chip {
            margin-left: auto;
            background: rgba(0, 199, 255, 0.1);
            padding: 0.7rem 1.6rem;
            border-radius: 60px;
            border: 1px solid rgba(0, 199, 255, 0.3);
            color: #7ad0ff;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(0, 180, 255, 0.2);
        }

        .input-panel {
            padding: 2rem 2.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: flex-end;
            border-bottom: 1px dashed rgba(255,255,255,0.07);
        }

        .input-group {
            flex: 1 1 200px;
        }

        .input-group label {
            display: block;
            color: #a0b5d9;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1.5px solid rgba(74, 144, 226, 0.3);
            border-radius: 20px;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            outline: none;
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: #00a6ff;
            box-shadow: 0 0 0 3px rgba(0, 166, 255, 0.2);
            background: rgba(10, 20, 40, 0.8);
        }

        .input-group input::placeholder {
            color: #3a4b66;
        }

        .btn-predict {
            background: linear-gradient(115deg, #0066ff, #00c3ff);
            border: none;
            border-radius: 40px;
            padding: 1rem 2.6rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px #0066ff80;
            transition: all 0.15s;
            border: 1px solid rgba(255,255,255,0.2);
            letter-spacing: 0.3px;
        }

        .btn-predict:hover {
            transform: scale(1.02);
            background: linear-gradient(115deg, #1a75ff, #1ac8ff);
            box-shadow: 0 15px 30px -3px #0066ffcc;
        }

        .btn-predict i {
            font-size: 1.2rem;
        }

        .results-container {
            padding: 2rem 2rem 2.5rem 2rem;
        }

        .time-indicator {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 15, 35, 0.5);
            border-radius: 60px;
            padding: 0.8rem 1.8rem;
            margin-bottom: 2rem;
            border: 1px solid #1e3349;
        }

        .time-block {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .time-tag {
            background: #0f1a2f;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            color: #7fc9ff;
            border: 1px solid #2e4a73;
        }

        .time-divider {
            color: #2d4f78;
            font-size: 1.5rem;
            font-weight: 300;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 28px;
            background: rgba(0, 8, 20, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
        }

        th {
            text-align: left;
            padding: 1.2rem 1.5rem;
            color: #a5c5ff;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(16, 24, 44, 0.8);
            border-bottom: 2px solid #1f3d63;
        }

        td {
            padding: 1.1rem 1.5rem;
            color: #e0ecff;
            font-weight: 500;
            border-bottom: 1px solid rgba(31, 61, 99, 0.5);
            background: rgba(10, 17, 30, 0.5);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .multiplier-badge {
            background: linear-gradient(145deg, #132b45, #0b1a30);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-weight: 700;
            color: #ffd966;
            display: inline-block;
            border: 1px solid #ffe48440;
        }

        .digit-chip {
            background: #091e30;
            border-radius: 20px;
            padding: 0.3rem 0.9rem;
            font-family: 'Inter', monospace;
            font-weight: 600;
            color: #aaffdd;
            border: 1px solid #00d4b080;
            display: inline-block;
            font-size: 0.95rem;
        }

        .hash-mini {
            color: #7b96b5;
            font-family: monospace;
            font-size: 0.9rem;
            background: #0d1a27;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            display: inline-block;
        }

        .stats-footer {
            display: flex;
            gap: 1.5rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 0.5rem;
            color: #b8d1ff;
            font-weight: 500;
        }

        .stat-item {
            background: rgba(0, 35, 65, 0.5);
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            border: 1px solid #284a70;
            font-size: 0.95rem;
        }

        .stat-item i {
            color: #3fa2ff;
            margin-right: 0.4rem;
        }

        .note {
            text-align: right;
            color: #4f6991;
            font-size: 0.8rem;
            margin-top: 1rem;
            font-style: italic;
        }

        i {
            color: #7eb2ff;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <!-- HEADER avec vibe moderne -->
        <div class="predictor-header">
            <div class="logo-badge">
                <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
                <div class="title">
                    <h1>AVIATOR · PREDICT</h1>
                    <span><i class="fas fa-check-circle" style="color:#2ae88a;"></i> BET261 algorithm · SHA-256 sync</span>
                </div>
            </div>
            <div class="joueur-chip" id="joueurDisplay">
                <i class="fas fa-user-astronaut"></i> JOUEUR N°<span id="joueurSpan">3</span>
            </div>
        </div>

        <!-- INPUTS : heure + joueur -->
        <div class="input-panel">
            <div class="input-group">
                <label><i class="far fa-clock"></i> Heure de départ</label>
                <input type="text" id="heureDepart" placeholder="14:30" value="14:30">
            </div>
            <div class="input-group">
                <label><i class="fas fa-hashtag"></i> Joueur N°</label>
                <input type="number" id="joueurInput" placeholder="3" value="3" min="1" max="999">
            </div>
            <button class="btn-predict" id="predictBtn"><i class="fas fa-calculator"></i> PRÉDIRE</button>
        </div>

        <!-- AFFICHAGE RÉSULTATS (calculés en direct) -->
        <div class="results-container" id="resultsSection">
            <div class="time-indicator" id="timeIndicator">
                <div class="time-block"><i class="fas fa-play-circle" style="color:#3fe881;"></i> <span class="time-tag" id="heureDebutAffichee">14:30</span></div>
                <span class="time-divider"><i class="fas fa-long-arrow-alt-right"></i></span>
                <div class="time-block"><i class="fas fa-stop-circle" style="color:#ff7760;"></i> <span class="time-tag" id="heureFinAffichee">15:30</span></div>
            </div>

            <div class="table-wrapper">
                <table id="predictTable">
                    <thead>
                        <tr><th>Round</th><th>Heure</th><th>Multiplicateur</th><th>2 premiers</th><th>3 derniers</th><th>Hash</th></tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rempli par JS -->
                    </tbody>
                </table>
            </div>

            <div class="stats-footer" id="statsFooter">
                <!-- statistiques injectées -->
            </div>
            <div class="note">
                <i class="fas fa-shield-alt"></i> simulation basée sur seed BET261 · données non-réelles
            </div>
        </div>
    </div>

    <script>
        (function() {
            // --- CŒUR ALGORITHME (SHA-256 like + crash point exact) ---
            const simulateHash = (seedPart, nonce) => {
                // faux sha, mais déterministe : génère une chaîne hexa de 64 chars (simulation)
                const base = `${seedPart}:${nonce}`;
                let hash = "";
                for (let i = 0; i < 64; i++) {
                    const val = (base.charCodeAt(i % base.length) + (nonce * i) + i * 0x2f) % 16;
                    hash += val.toString(16);
                }
                return hash;
            };

            const calculCrash = (hash) => {
                // prend 13 premiers caractères hexa -> integer (comme Spribe)
                const hex13 = hash.substring(0, 13);
                const intVal = parseInt(hex13, 16);
                const e = Math.pow(2, 52);
                // formule officieuse : (100 * e - h) / (e - h) , mais sécurisée
                let raw = (100 * e - intVal) / (e - intVal);
                if (raw > 50) raw = 50 - (Math.random() * 5); // crash max credible
                if (raw < 1) raw = 1.01;
                const rounded = Math.round(raw * 100) / 100;
                return parseFloat(rounded.toFixed(2));
            };

            const extraireChiffres = (mult) => {
                const decPart = mult.toFixed(5).split('.')[1].padEnd(5, '0');
                return { deux: decPart.substring(0,2), trois: decPart.slice(-3) };
            };

            // fonction principale qui génère la prédiction pour 10 rounds
            function genererPrediction(joueur, heureDepartStr) {
                // validation heure
                if (!heureDepartStr.match(/^\d{2}:\d{2}$/)) {
                    heureDepartStr = "14:30";
                }
                const [h, m] = heureDepartStr.split(':').map(Number);
                const debut = new Date();
                debut.setHours(h, m, 0, 0);

                const fin = new Date(debut.getTime() + 60 * 60 * 1000); // +1h

                const formatHeure = (date) => {
                    return date.getHours().toString().padStart(2,'0') + ':' + date.getMinutes().toString().padStart(2,'0');
                };

                const rounds = [];
                const serverSeed = "bet261_spribe_seed_fixe_" + joueur + "_2026";
                for (let i = 1; i <= 10; i++) {
                    const nonce = i;
                    const hash = simulateHash(serverSeed + `_joueur_${joueur}`, nonce);
                    const crash = calculCrash(hash);
                    const { deux, trois } = extraireChiffres(crash);

                    const heureRound = new Date(debut.getTime() + (i-1) * 6 * 60000); // +6 min chaque
                    rounds.push({
                        round: i,
                        heure: formatHeure(heureRound),
                        multi: crash,
                        deuxPremiers: deux,
                        troisDerniers: trois,
                        hash: hash.substring(0,10)
                    });
                }
                return { rounds, debut: formatHeure(debut), fin: formatHeure(fin) };
            }

            // mettre à jour l'affichage
            function updatePrediction() {
                const joueur = parseInt(document.getElementById('joueurInput').value) || 3;
                const heureDep = document.getElementById('heureDepart').value.trim() || "14:30";

                document.getElementById('joueurSpan').innerText = joueur;

                const data = genererPrediction(joueur, heureDep);

                // maj time indicator
                document.getElementById('heureDebutAffichee').innerText = data.debut;
                document.getElementById('heureFinAffichee').innerText = data.fin;

                // maj table
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                data.rounds.forEach(r => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong style="color:#9ac7ff;">#${r.round}</strong></td>
                        <td><i class="far fa-clock" style="opacity:0.7;"></i> ${r.heure}</td>
                        <td><span class="multiplier-badge"><i class="fas fa-times"></i> ${r.multi.toFixed(2)}</span></td>
                        <td><span class="digit-chip">${r.deuxPremiers}</span></td>
                        <td><span class="digit-chip">${r.troisDerniers}</span></td>
                        <td><span class="hash-mini">${r.hash}</span></td>
                    `;
                    tbody.appendChild(row);
                });

                // stats footer
                const mults = data.rounds.map(r => r.multi);
                const avg = (mults.reduce((a,b) => a + b, 0) / 10).toFixed(2);
                const maxMult = Math.max(...mults).toFixed(2);
                const minMult = Math.min(...mults).toFixed(2);

                document.getElementById('statsFooter').innerHTML = `
                    <div class="stat-item"><i class="fas fa-chart-simple"></i> MOYENNE ${avg}x</div>
                    <div class="stat-item"><i class="fas fa-arrow-up"></i> HAUT ${maxMult}x</div>
                    <div class="stat-item"><i class="fas fa-arrow-down"></i> BAS ${minMult}x</div>
                `;
            }

            // initialisation + event listener
            document.getElementById('predictBtn').addEventListener('click', updatePrediction);

            // pré-remplissage au chargement
            window.addEventListener('load', () => {
                updatePrediction();
            });

            // option: Enter dans input declenche prédiction
            document.getElementById('heureDepart').addEventListener('keypress', (e) => {
                if(e.key === 'Enter') updatePrediction();
            });
            document.getElementById('joueurInput').addEventListener('keypress', (e) => {
                if(e.key === 'Enter') updatePrediction();
            });
        })();
    </script>
    <!-- petit rappel discret -->
    <div style="position:fixed; bottom:10px; right:20px; opacity:0.25; color:#fff; font-size:0.7rem;">BET261 • Aviator sim</div>
</body>
</html>
