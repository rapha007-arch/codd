<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREDICTOR V2 • Aviator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 30% 10%, #0e141f, #03050a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            max-width: 560px;
            width: 100%;
            background: rgba(6, 12, 24, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 180, 40, 0.25);
            border-radius: 2.5rem;
            padding: 2.2rem 1.8rem;
            box-shadow: 0 30px 60px -15px #000000cc, 0 0 0 1px rgba(255, 200, 50, 0.2) inset;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-align: center;
            background: linear-gradient(150deg, #ffd966, #ffaa33, #ff8800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.15rem;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .subtitle {
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 0.45em;
            color: #8a9bb5;
            margin-bottom: 2rem;
            text-transform: uppercase;
            font-weight: 500;
        }

        .input-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .input-group label {
            position: absolute;
            left: 1.2rem;
            top: -0.7rem;
            background: #0a1020;
            padding: 0 0.7rem;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ffaa33;
            text-transform: uppercase;
            border-left: 3px solid #ffaa33;
            border-right: 3px solid #ffaa33;
            border-radius: 20px;
            z-index: 5;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 170, 0, 0.4);
            border-radius: 2rem;
            padding: 1.2rem 1.8rem;
            font-size: 1.6rem;
            font-family: 'Major Mono Display', 'Courier New', monospace;
            color: #b8f2b0;
            text-align: center;
            letter-spacing: 3px;
            transition: 0.15s;
            caret-color: #ffaa33;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ffaa33;
            box-shadow: 0 0 25px rgba(255, 140, 0, 0.6);
        }

        .input-group input::placeholder {
            color: #3d5068;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        button#calculerBtn {
            width: 100%;
            background: linear-gradient(165deg, #fb8b2c, #d43400);
            border: none;
            border-bottom: 6px solid #941f00;
            color: white;
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: 6px;
            padding: 1.1rem 0;
            border-radius: 4rem;
            margin: 1.8rem 0 1.8rem;
            cursor: pointer;
            transition: all 0.05s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            box-shadow: 0 12px 25px -5px #ff5e00b3;
            text-transform: uppercase;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        button#calculerBtn:active {
            transform: translateY(5px);
            border-bottom-width: 2px;
        }

        .result-box {
            background: rgba(0, 5, 15, 0.7);
            border: 2px solid #55cc77;
            border-radius: 2.5rem;
            padding: 1.2rem 1.8rem;
            margin: 1.2rem 0 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 28px #31b75e4d;
        }

        .result-label {
            color: #c0d2f0;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .result-value {
            background: #14212e;
            padding: 0.7rem 2.2rem;
            border-radius: 4rem;
            font-size: 2.3rem;
            font-weight: 800;
            font-family: 'Major Mono Display', 'Courier New', monospace;
            color: #b0ffb0;
            border: 1px solid #6fe081;
            box-shadow: 0 0 12px #51d46b;
        }

        .tip-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
            background: rgba(255, 200, 40, 0.08);
            border: 2px solid rgba(255, 190, 0, 0.5);
            border-radius: 3rem;
            padding: 1rem;
            color: #ffcd7e;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.18s;
            margin: 0.8rem 0 1rem;
            backdrop-filter: blur(4px);
        }

        .tip-button:hover {
            background: rgba(255, 190, 0, 0.2);
            border-color: #ffbe1a;
            color: #ffdd99;
        }

        .tip-content {
            background: #0a1424f2;
            border: 2px solid #f0b34b;
            border-radius: 2rem;
            padding: 1.4rem 1.8rem;
            color: #fad987;
            font-size: 0.95rem;
            line-height: 1.7;
            font-family: 'Space Mono', monospace;
            white-space: pre-line;
            margin: 0.5rem 0 1.5rem;
            box-shadow: inset 0 0 15px #221000;
        }

        .history {
            margin-top: 2rem;
        }

        .history h3 {
            color: #ffaa33;
            font-size: 1.1rem;
            letter-spacing: 3px;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px dashed #f90b;
            padding-bottom: 0.4rem;
        }

        .history-list {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 1.8rem;
            padding: 0.5rem 0.8rem;
            max-height: 260px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #ffaa33 #1a2637;
        }

        .history-list::-webkit-scrollbar {
            width: 5px;
        }
        .history-list::-webkit-scrollbar-track {
            background: #1a2637;
            border-radius: 20px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #ffaa33;
            border-radius: 20px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111d2bbb;
            border-radius: 3rem;
            padding: 0.7rem 1.2rem;
            margin: 0.6rem 0;
            border: 1px solid #ffa824;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .history-item span:first-child {
            color: #b2c9f0;
        }
        .history-item .hist-hex {
            color: #faca70;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item .hist-result {
            color: #a5f0b0;
            font-weight: 700;
            background: #1b2a3c;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
        }

        .clear-btn {
            color: #ff6f6f;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            margin-left: auto;
            padding: 0.2rem 0.6rem;
            border-radius: 3rem;
            background: #2f1b1b;
            transition: 0.1s;
        }
        .clear-btn:hover {
            background: #4f2b2b;
            text-decoration: none;
            color: #ffb0b0;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1c293d;
            border-left: 5px solid #ffaa33;
            padding: 1rem 2rem;
            border-radius: 1.8rem;
            color: #f0f0f0;
            font-weight: 500;
            box-shadow: 0 15px 30px black;
            z-index: 9999;
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .error-toast { border-left-color: #ef4444; }
        .success-toast { border-left-color: #4CAF50; }

        @media screen and (min-width: 1024px) {
            .card {
                max-width: 900px !important;
                padding: 3rem !important;
            }
            h1 {
                font-size: 3.5rem !important;
            }
            .subtitle {
                font-size: 1rem !important;
                margin-bottom: 3rem !important;
            }
            .input-group label {
                font-size: 1.1rem !important;
                top: -0.9rem !important;
            }
            .input-group input {
                font-size: 2.2rem !important;
                padding: 1.5rem 2rem !important;
            }
            button#calculerBtn {
                font-size: 2.5rem !important;
                padding: 1.5rem 0 !important;
                letter-spacing: 8px !important;
            }
            .result-box {
                padding: 1.5rem 2.5rem !important;
            }
            .result-label {
                font-size: 1.3rem !important;
            }
            .result-value {
                font-size: 3rem !important;
                padding: 1rem 3rem !important;
            }
            .tip-button {
                font-size: 1.5rem !important;
                padding: 1.2rem !important;
            }
            .history h3 {
                font-size: 1.4rem !important;
            }
            .history-item {
                font-size: 1.1rem !important;
                padding: 1rem 1.5rem !important;
            }
        }
    </style>
</head>
